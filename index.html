<!--
  ===========================================================
  EMBER & BRINE — Single-page React app for GoHighLevel (CDN only, no build step)
  ===========================================================
  One GHL page, five views, switched by React Router (HashRouter):
    yourpage#/          → home: best sellers, hottest, heat picker, reviews, FAQ
    yourpage#/sauces    → all sauces with search and heat filter
                           (search is kept in the link, e.g. #/sauces?q=ghost&heat=5)
    yourpage#/sauce/1   → one sauce: full details, quantity, and total price
                           (loaded from ITEM_URL; unknown ids show a "not found" page)
    yourpage#/checkout  → order summary (left) + Stripe card form (right), test mode by default
    yourpage#/orders    → track an order by its reference (order_key), e.g. #/orders/53264ed2-...
  HashRouter is used because GHL serves a single page URL; the part after # never
  reaches GHL's server, so refreshes and shared links always work.

  Loads React 18.3.1, React Router 6.26.2, Babel Standalone, and Bootstrap 5.3.3 CSS from jsDelivr.

  HOW TO USE IN GHL
  1. Add a full-width section with a "Custom JS/HTML" (code) element.
  2. Paste EVERYTHING in this file.
  3. Edit CONFIG at the top of the React script (API URLs, shipping, your Stripe test key, and ORDER_URL).

  NOTE: Bootstrap's CSS applies to the whole page, so other GHL elements on this
  page may pick up Bootstrap's base styles. Best results: build the page from this block alone.
-->

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const { HashRouter, Routes, Route, Link, NavLink, useLocation, useSearchParams, useParams, useNavigate } = ReactRouterDOM;
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

/* ========== ROUTES ==========
   Uses HashRouter, so everything runs on one GHL page:
     #/          → home (best sellers + hottest)
     #/sauces    → all sauces with search (e.g. #/sauces?q=ghost&heat=5)
     #/sauce/:id → one sauce, with quantity and total (e.g. #/sauce/1)
     #/checkout  → order summary + Stripe card form (test mode)
     #/orders    → look up an order by its reference (order_key UUID)
     #/orders/:orderKey → that order's details, shareable */

/* ========== CONFIG — edit for your store ========== */
const CONFIG = {
  API_URL: "https://general-server-nine.vercel.app/api/hotsauce/top", // loads first
  ALL_URL: "https://general-server-nine.vercel.app/api/hotsauce",     // loads when the Sauces page opens
  ITEM_URL: "https://general-server-nine.vercel.app/api/hotsauce/id/:id", // one sauce; :id is replaced
  MAX_QTY: 99, // most bottles of one sauce per order (also limited by stock)
  SHIPPING_FLAT: 6.95, // shipping charged below FREE_SHIP_AT

  /* ---- Stripe ----
     STRIPE_PUBLISHABLE_KEY: your TEST publishable key (Stripe Dashboard → Developers → API keys,
     starts with pk_test_). Safe to keep in page code. Never put a secret key (sk_...) here.
     ORDER_URL: your server endpoint that saves the order and charges the card.
       Leave "" for test mode: Stripe checks the card, nothing is saved or charged.
     ORDER_CONFIRM_URL: optional, called after bank verification (3D Secure) finishes; :id is the order id.
       If empty, the page sends the same request to ORDER_URL again (same order_key and pm),
       and your server replies with the payment's current status instead of charging again.
     See the note above handleSubmit in CheckoutPage for the exact request and replies. */
  STRIPE_PUBLISHABLE_KEY: "pk_test_51MBpvdGLHvN4FwS9NOVmVHrpHOho1s6yOSX4EkNOzfmPL2FSch7vwKywC6De47c330pcX3dsnAQcg01kByEJj4dC00oaePyIrP",
  ORDER_URL: "https://general-server-nine.vercel.app/api/hotsauce-order", // POST: save order + charge card
  DEBUG_CHECKOUT: true,   // logs every checkout step to the browser console; set false when live
  ORDER_LOOKUP_URL: "https://general-server-nine.vercel.app/api/hotsauce-order/:order_key", // GET one order; :order_key is replaced
  ORDER_CONFIRM_URL: "",  // optional; if empty, the page re-sends the same order to ORDER_URL after bank verification
  FREE_SHIP_AT: 35,
  CURRENCY: "$",
  BUNDLE: { id: "trio", name: "The Trio", price: 31, color: "#F08A24", bg: "#FCE9C6", stock: null },
  CART_KEY: "eb-cart",
  CART_ITEMS_KEY: "eb-cart-items"
};

/* ---------- helpers ---------- */
const money = (n) => CONFIG.CURRENCY + n.toFixed(2);

function bottleSrc(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 220">
    <rect x="38" y="4" width="24" height="22" rx="4" fill="#2E1A2B"/>
    <path d="M40 26h20v24c0 6 18 14 18 30v124a12 12 0 0 1-12 12H34a12 12 0 0 1-12-12V80c0-16 18-24 18-30z" fill="${color}"/>
    <rect x="22" y="104" width="56" height="70" fill="#FFFCF4"/>
    <path d="M50 120c6 8 9 14 9 20a9 9 0 0 1-18 0c0-6 3-12 9-20z" fill="${color}"/>
    <rect x="32" y="158" width="36" height="5" rx="2.5" fill="#2E1A2B"/>
    <path d="M30 60c-2 6-2 14-2 20v100" stroke="#fff" stroke-opacity=".35" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
const imgFor = (p) => p.image || bottleSrc(p.color);
const itemPath = (p) => `/sauce/${encodeURIComponent(p.dbId)}`;
const HEAT_LABELS = ["", "Mild", "Medium", "Hot", "Very hot", "Extreme"];
const isSoldOut = (p) => p.stock !== null && p.stock !== undefined && p.stock <= 0;

function mapSauce(r) {
  return {
    id: String(r.slug || r.id),          // cart key
    dbId: String(r.id != null ? r.id : r.slug), // used in the item page link and API
    name: r.name || "Hot sauce",
    desc: r.description || "",
    heat: Math.min(5, Math.max(1, Number(r.heat_level) || 1)),
    price: (Number(r.price_cents) || 0) / 100,
    color: r.color_hex || "#C8321F",
    bg: r.bg_hex || "#FBE3D2",
    image: r.image_url || "",
    buyUrl: r.buy_url || "",
    stock: r.stock_qty == null ? null : Number(r.stock_qty),
    sizeOz: r.size_oz ? parseFloat(r.size_oz) : null,
    peppers: Array.isArray(r.main_peppers) ? r.main_peppers : [],
    ingredients: r.ingredients || "",
    fermentDays: r.ferment_days == null ? null : Number(r.ferment_days),
    currency: r.currency || "USD",
    vegan: !!r.is_vegan,
    glutenFree: !!r.is_gluten_free
  };
}

function loadCartItems() {
  try { return JSON.parse(localStorage.getItem(CONFIG.CART_ITEMS_KEY) || "{}") || {}; } catch (e) { return {}; }
}
function loadCart() {
  try { return JSON.parse(localStorage.getItem(CONFIG.CART_KEY) || "{}") || {}; } catch (e) { return {}; }
}

/* ---------- data hook ---------- */
const keepActive = (rows) => (Array.isArray(rows) ? rows : []).filter((r) => r && r.is_active !== false).map(mapSauce);
const byHeatThenName = (a, b) => a.heat - b.heat || a.name.localeCompare(b.name);

function getJson(url) {
  return fetch(url, { headers: { Accept: "application/json" } })
    .then((res) => { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); });
}

// /top returns { best_selling: [...], hottest: [...] }. The API's order is kept (it's a ranking).
function fetchTop() {
  return getJson(CONFIG.API_URL).then((data) => ({
    bestSelling: keepActive(data && data.best_selling),
    hottest: keepActive(data && data.hottest)
  }));
}

// The full list returns a plain array (or { data: [...] }).
function fetchAll() {
  return getJson(CONFIG.ALL_URL).then((data) => keepActive(Array.isArray(data) ? data : data && data.data).sort(byHeatThenName));
}

// Unique sauces across lists, by id
function uniqueSauces(lists) {
  const seen = {};
  const out = [];
  lists.forEach((list) => list.forEach((s) => { if (!seen[s.id]) { seen[s.id] = true; out.push(s); } }));
  return out;
}

// Top lists load right away. The full list loads the first time the Sauces page opens,
// then stays cached while the visitor moves between pages.
function useSauceData() {
  const [top, setTop] = useState({ status: "loading", bestSelling: [], hottest: [] });
  const [full, setFull] = useState({ status: "idle", all: [] });
  const fullStarted = useRef(false);

  const loadTop = useCallback(() => {
    setTop({ status: "loading", bestSelling: [], hottest: [] });
    fetchTop()
      .then((d) => setTop({ status: "ready", ...d }))
      .catch((err) => { console.error("Hot sauce API error:", err); setTop((t) => ({ ...t, status: "error" })); });
  }, []);

  const loadAll = useCallback(() => {
    fullStarted.current = true;
    setFull({ status: "loading", all: [] });
    fetchAll()
      .then((all) => setFull({ status: "ready", all }))
      .catch((err) => { console.error("Hot sauce API error:", err); setFull((f) => ({ ...f, status: "error" })); });
  }, []);

  const ensureAll = useCallback(() => { if (!fullStarted.current) loadAll(); }, [loadAll]);

  useEffect(loadTop, [loadTop]);

  const topItems = useMemo(() => uniqueSauces([top.bestSelling, top.hottest]).sort(byHeatThenName), [top.bestSelling, top.hottest]);
  const known = useMemo(() => uniqueSauces([full.all, top.bestSelling, top.hottest]), [full.all, top.bestSelling, top.hottest]);

  return { top, full, topItems, known, reloadTop: loadTop, reloadAll: loadAll, ensureAll };
}

// Link to a section of the home page, from any page
function SectionLink({ section, children, ...rest }) {
  return <Link to="/" state={{ section }} {...rest}>{children}</Link>;
}

// Scrolls to the top on page change, or to a section when a link asks for one
function ScrollManager() {
  const location = useLocation();
  useEffect(() => {
    const section = location.state && location.state.section;
    if (section === "keep") return;
    const id = setTimeout(() => {
      const el = section && document.getElementById(section);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      else window.scrollTo(0, 0);
    }, 30);
    return () => clearTimeout(id);
  }, [location.key]);
  return null;
}

/* ---------- small pieces ---------- */
function HeatMarks({ level }) {
  return (
    <span className="eb-heat d-inline-flex align-items-center" aria-label={`Heat ${level} of 5`}>
      {[1, 2, 3, 4, 5].map((i) => <i key={i} className={i <= level ? "on" : ""} />)}
    </span>
  );
}

function BuyButton({ product, onAdd, className = "" }) {
  if (isSoldOut(product)) {
    return <button className={`btn btn-outline-secondary rounded-pill fw-semibold ${className}`} disabled>Sold out</button>;
  }
  if (product.buyUrl) {
    return <a className={`btn btn-plum rounded-pill fw-semibold ${className}`} href={product.buyUrl}>Buy now</a>;
  }
  return <button className={`btn btn-plum rounded-pill fw-semibold ${className}`} onClick={() => onAdd(product.id)}>Add to cart</button>;
}

/* ---------- header ---------- */
function Header({ count, onOpenCart }) {
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 40);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  const close = () => setMenuOpen(false);
  const activeStyle = { textDecoration: "underline", textUnderlineOffset: 6, textDecorationThickness: 2 };
  return (
    <nav className={`navbar navbar-expand-md bg-mustard sticky-top eb-nav ${scrolled ? "eb-scrolled" : ""}`}>
      <div className="container eb-bar">
        <SectionLink section="top" className="navbar-brand text-reset" onClick={close}>Ember &amp; Brine</SectionLink>
        <div className="d-flex align-items-center gap-2 order-md-last">
          <button className="btn bg-paper rounded-pill fw-semibold d-flex align-items-center gap-2" onClick={onOpenCart} aria-label="Open cart">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z" /><path d="M9 7a3 3 0 0 1 6 0" /></svg>
            <span className="d-none d-sm-inline">Cart</span>
            <span className="badge rounded-pill bg-chili">{count}</span>
          </button>
          <button className="navbar-toggler border-0" type="button" onClick={() => setMenuOpen(!menuOpen)} aria-expanded={menuOpen} aria-label="Open menu">
            <span className="navbar-toggler-icon" />
          </button>
        </div>
        <div className={`collapse navbar-collapse ${menuOpen ? "show" : ""}`}>
          <ul className="navbar-nav mx-auto gap-md-4 py-3 py-md-0">
            <li className="nav-item">
              <NavLink to="/" end state={{ section: "top" }} className="nav-link" onClick={close} style={({ isActive }) => (isActive ? activeStyle : undefined)}>Home</NavLink>
            </li>
            <li className="nav-item">
              <NavLink to="/sauces" className="nav-link" onClick={close} style={({ isActive }) => (isActive ? activeStyle : undefined)}>Sauces</NavLink>
            </li>
            <li className="nav-item">
              <NavLink to="/orders" className="nav-link" onClick={close} style={({ isActive }) => (isActive ? activeStyle : undefined)}>Track order</NavLink>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  );
}

/* ---------- heat picker ---------- */
function HeatPicker({ sauces, status, onAdd }) {
  const [level, setLevel] = useState(2);
  const [index, setIndex] = useState(0);
  const [animKey, setAnimKey] = useState(0);

  const matches = useMemo(() => {
    if (!sauces.length) return [];
    const nearest = sauces.reduce((best, s) => (Math.abs(s.heat - level) < Math.abs(best - level) ? s.heat : best), sauces[0].heat);
    return sauces.filter((s) => s.heat === nearest);
  }, [sauces, level]);

  useEffect(() => { setIndex(0); }, [level]);
  useEffect(() => { setAnimKey((k) => k + 1); }, [level, index]);

  const p = matches.length ? matches[index % matches.length] : null;

  return (
    <div className="bg-paper rounded-5 p-4 p-lg-5 eb-picker" aria-live="polite">
      <p className="fw-semibold fs-5 mb-1">How hot do you like it?</p>
      <p className="text-soft small mb-3">Slide to find your sauce.</p>
      <input type="range" className="form-range eb-range" min="1" max="5" step="1" value={level}
        onChange={(e) => setLevel(+e.target.value)} aria-label="Heat level, 1 to 5" />
      <div className="d-flex justify-content-between small text-soft mt-2"><span>Barely there</span><span>Bring tissues</span></div>
      <hr className="my-4" style={{ borderTop: "2px dashed #CDBFCB", opacity: 1 }} />

      {status === "loading" && (
        <p className="text-soft small mb-0 placeholder-glow"><span className="placeholder col-10" /><span className="placeholder col-7" /></p>
      )}
      {status === "error" && <p className="text-soft small mb-0">Sauce suggestions will show once the lineup loads.</p>}
      {status === "ready" && !p && <p className="text-soft small mb-0">No sauces are available right now.</p>}
      {p && (
        <div className="d-flex gap-3 align-items-center eb-swap" key={animKey}>
          <div className="eb-img-box flex-shrink-0" style={{ width: 80, height: 150 }}><img src={imgFor(p)} alt={`${p.name} bottle`} /></div>
          <div style={{ minWidth: 0 }}>
            <p className="fw-bold fs-3 lh-1 mb-2"><Link to={itemPath(p)} className="text-reset text-decoration-none">{p.name}</Link></p>
            <p className="small text-soft mb-3">{p.desc}</p>
            <div className="d-flex flex-wrap align-items-center gap-3">
              <HeatMarks level={p.heat} /><strong>{money(p.price)}</strong>
              <BuyButton product={p} onAdd={onAdd} className="btn-sm px-3" />
            </div>
            {matches.length > 1 && (
              <button className="btn btn-link btn-sm p-0 mt-2 text-reset" onClick={() => setIndex(index + 1)}>
                Show another at this heat ({(index % matches.length) + 1} of {matches.length})
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function Hero(props) {
  return (
    <section className="bg-mustard eb-hero overflow-hidden">
      <div className="container">

function matchesSearch(p, words) {
  if (!words.length) return true;
  const text = [p.name, p.desc, p.peppers.join(" ")].join(" ").toLowerCase();
  return words.every((w) => text.indexOf(w) > -1);
}

function SaucesPage({ status, all, reload, ensureAll, onAdd }) {

// Fetches one sauce. Result: { status: "loading" | "ready" | "notfound" | "error", item }
function useSauce(id) {
  const [state, setState] = useState({ status: "loading", item: null });
  const [attempt, setAttempt] = useState(0);
  useEffect(() => {
    let cancelled = false;
    setState({ status: "loading", item: null });
    fetch(CONFIG.ITEM_URL.replace(":id", encodeURIComponent(id)), { headers: { Accept: "application/json" } })
      .then((res) => {
        if (res.status === 404 || res.status === 400) return null; // no such sauce
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then((data) => {
        if (cancelled) return;
        const row = data && (data.data || data);
        if (!row || row.id == null || row.is_active === false) setState({ status: "notfound", item: null });
        else setState({ status: "ready", item: mapSauce(row) });
      })
      .catch((err) => { if (!cancelled) { console.error("Hot sauce API error:", err); setState({ status: "error", item: null }); } });
    return () => { cancelled = true; };
  }, [id, attempt]);
  return { ...state, retry: () => setAttempt((a) => a + 1) };
}

/* ---------- checkout ---------- */
// Reads the order server's reply into one shape.
// Success:  { order: {...hot_sauce_orders row}, items: [...], payment: { status, payment_intent_id, amount_received_cents } }
// Failure:  HTTP 402 { error: "Your card was declined.", code: "card_declined" }   (nothing saved)
function readOrderReply(data) {
  const order = (data && data.order) || {};
  const payment = (data && data.payment) || {};
  const cents = (v) => (typeof v === "number" ? v : v != null && v !== "" && !isNaN(Number(v)) ? Number(v) : null);
  return {
    status: payment.status || order.payment_status || (data && data.status) || null, // succeeded | requires_action | processing | ...
    orderId: order.id != null ? order.id : data && data.id,
    orderKey: order.order_key || null,
    orderStatus: order.status || null,
    paymentIntentId: payment.payment_intent_id || order.stripe_payment_intent_id || null,
    clientSecret: payment.client_secret || (data && data.client_secret) || null,
    subtotalCents: cents(order.subtotal_cents),
    shippingCents: cents(order.shipping_cents),
    taxCents: cents(order.tax_cents),
    totalCents: cents(order.total_cents != null ? order.total_cents : data && data.total_cents),
    amountReceivedCents: cents(payment.amount_received_cents != null ? payment.amount_received_cents : order.amount_received_cents),
    items: (data && data.items) || [],
    message: (data && (data.error || data.message)) || null,
    code: (data && data.code) || null
  };
}

// Checkout logger: prints each step to the browser console (F12 → Console) when DEBUG_CHECKOUT is on
const clog = (...args) => { if (CONFIG.DEBUG_CHECKOUT) console.log("%c[checkout]", "color:#C8321F;font-weight:bold", ...args); };
const cerr = (...args) => { if (CONFIG.DEBUG_CHECKOUT) console.error("[checkout]", ...args); };

function newOrderKey() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  // Fallback for older browsers: random version 4 UUID
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = (crypto.getRandomValues(new Uint8Array(1))[0] & 15);
    return (c === "x" ? r : (r & 3) | 8).toString(16);
  });
}
const shippingFor = (subtotal) => (subtotal <= 0 || subtotal >= CONFIG.FREE_SHIP_AT ? 0 : CONFIG.SHIPPING_FLAT);

// Loads Stripe.js once (it must come from js.stripe.com) and returns the Stripe instance
let stripePromise = null;
function loadStripe() {
  if (!stripePromise) {
    stripePromise = new Promise((resolve, reject) => {
      if (window.Stripe) return resolve(window.Stripe(CONFIG.STRIPE_PUBLISHABLE_KEY));
      const sc = document.createElement("script");
      sc.src = "https://js.stripe.com/v3/";
      sc.onload = () => (window.Stripe ? resolve(window.Stripe(CONFIG.STRIPE_PUBLISHABLE_KEY)) : reject(new Error("Stripe failed to load")));
      sc.onerror = () => { stripePromise = null; reject(new Error("Stripe failed to load")); };
      document.head.appendChild(sc);
    });
  }
  return stripePromise;
}

// totals (optional): { subtotal, shipping, tax, total } in dollars from the server; used after payment
function OrderSummary({ lines, subtotal: cartSubtotal, setQty, readOnly, totals }) {
  const subtotal = totals ? totals.subtotal : cartSubtotal;
  const shipping = totals ? totals.shipping : shippingFor(cartSubtotal);
  const tax = totals ? totals.tax : 0;
  const total = totals ? totals.total : subtotal + shipping;
  const count = lines.reduce((n, l) => n + l.qty, 0);
  return (
    <div className="bg-lime rounded-5 p-4 p-lg-5">
      <div className="d-flex justify-content-between align-items-baseline mb-3">
        <h2 className="h4 fw-bold mb-0">Your order</h2>
        <span className="small text-soft">{count} {count === 1 ? "item" : "items"}</span>
      </div>
      <ul className="list-unstyled mb-0">
        {lines.map(({ p, qty }) => (
          <li className="d-flex align-items-center gap-3 py-3 border-bottom" style={{ borderColor: "rgba(46,26,43,.15)" }} key={p.id}>
            <div className="position-relative flex-shrink-0">
              <div className="eb-img-box rounded-3 p-1 bg-paper" style={{ width: 60, height: 76 }}><img src={imgFor(p)} alt="" /></div>
              <span className="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-plum">{qty}</span>
            </div>
            <div className="flex-grow-1" style={{ minWidth: 0 }}>
              <div className="fw-semibold">{p.dbId ? <Link to={itemPath(p)} className="text-reset text-decoration-none">{p.name}</Link> : p.name}</div>
              <div className="small text-soft">{money(p.price)} each</div>
              {!readOnly && (
                <div className="d-flex align-items-center gap-2 mt-1 small">
                  <button className="btn btn-link btn-sm p-0 text-reset" onClick={() => setQty(p.id, qty - 1)} aria-label={`Remove one ${p.name}`}>−</button>
                  <span className="fw-semibold">{qty}</span>
                  <button className="btn btn-link btn-sm p-0 text-reset" onClick={() => setQty(p.id, qty + 1)} aria-label={`Add one ${p.name}`}
                    disabled={p.stock !== null && p.stock !== undefined && qty >= p.stock}>+</button>
                  <button className="btn btn-link btn-sm p-0 ms-2 text-soft" onClick={() => setQty(p.id, 0)}>Remove</button>
                </div>
              )}
            </div>
            <div className="fw-semibold text-end">{money(p.price * qty)}</div>
          </li>
        ))}
      </ul>
      <dl className="mt-3 mb-0">
        <div className="d-flex justify-content-between py-1"><dt className="fw-normal">Subtotal</dt><dd className="mb-0">{money(subtotal)}</dd></div>
        <div className="d-flex justify-content-between py-1"><dt className="fw-normal">Shipping</dt><dd className="mb-0">{shipping ? money(shipping) : "Free"}</dd></div>
        {tax > 0 && <div className="d-flex justify-content-between py-1"><dt className="fw-normal">Tax</dt><dd className="mb-0">{money(tax)}</dd></div>}
        <div className="d-flex justify-content-between pt-3 mt-2 border-top border-2 fs-5 fw-bold" style={{ borderColor: "var(--eb-plum)" }}>
          <dt>Total</dt><dd className="mb-0">{money(total)}</dd>
        </div>
      </dl>
      {!readOnly && shipping > 0 && (
        <p className="small mt-3 mb-0">Add {money(CONFIG.FREE_SHIP_AT - subtotal)} more for free shipping.</p>
      )}
    </div>
  );
}

function Field({ label, id, error, ...rest }) {
  return (
    <div>
      <label htmlFor={id} className="form-label small fw-semibold mb-1">{label}</label>
      <input id={id} className={`form-control form-control-lg bg-paper ${error ? "is-invalid" : ""}`} style={{ borderRadius: 14 }} {...rest} />
      {error && <div className="invalid-feedback">{error}</div>}
    </div>
  );
}

function CheckoutPage({ lines, subtotal, setQty, onPaid }) {
  const [stripe, setStripe] = useState(null);
  const [stripeError, setStripeError] = useState("");
  const cardRef = useRef(null);
  const cardEl = useRef(null);
  const [cardState, setCardState] = useState({ complete: false, error: "" });
  const [form, setForm] = useState({ email: "", name: "", address: "", address2: "", city: "", state: "", zip: "" });
  // One key per checkout. Kept across retries (e.g. after a declined card) so the server
  // reuses the same pending order instead of creating a duplicate.
  const orderKey = useRef(newOrderKey());
  const [errors, setErrors] = useState({});
  const [processing, setProcessing] = useState(false);
  const [payError, setPayError] = useState("");
  const [done, setDone] = useState(null); // order snapshot after success

  const shipping = shippingFor(subtotal);
  const total = subtotal + shipping;

  // Load Stripe and mount the card field
  useEffect(() => {
    if (done || !lines.length) return;
    let card;
    let cancelled = false;
    loadStripe()
      .then((s) => {
        if (cancelled || !cardRef.current) return;
        setStripe(s);
        const elements = s.elements({
          fonts: [{ cssSrc: "https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600&display=swap" }]
        });
        card = elements.create("card", {
          hidePostalCode: true, // ZIP is collected in the shipping fields
          style: {
            base: { fontFamily: '"Bricolage Grotesque", system-ui, sans-serif', fontSize: "18px", color: "#2E1A2B", "::placeholder": { color: "#9C8A99" } },
            invalid: { color: "#C8321F", iconColor: "#C8321F" }
          }
        });
        card.mount(cardRef.current);
        card.on("change", (e) => setCardState({ complete: e.complete, error: e.error ? e.error.message : "" }));
        cardEl.current = card;
      })
      .catch((err) => { console.error(err); if (!cancelled) setStripeError("The payment form couldn't load. Check your connection and refresh the page."); });
    return () => { cancelled = true; if (card) card.destroy(); cardEl.current = null; };
  }, [done, lines.length > 0]);

  const set = (k) => (e) => { setForm({ ...form, [k]: e.target.value }); if (errors[k]) setErrors({ ...errors, [k]: "" }); };

  function validate() {
    const e = {};
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) e.email = "Enter an email like name@example.com.";
    if (!form.name.trim()) e.name = "Enter the name for the shipping label.";
    if (!form.address.trim()) e.address = "Enter a street address.";
    if (!form.city.trim()) e.city = "Enter a city.";
    if (!form.state.trim()) e.state = "Enter a state.";
    if (!/^\d{5}(-\d{4})?$/.test(form.zip.trim())) e.zip = "Enter a 5-digit ZIP code.";
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  /* How payment works (Pay button):
     1. Stripe turns the card into a PaymentMethod (pm_...). Card typos are caught here,
        before anything is saved.
     2. Live mode (ORDER_URL set): the page POSTs this JSON to ORDER_URL. Keys match the
        hot_sauce_orders / hot_sauce_order_items columns:
          { order_key, customer_name, customer_email,
            shipping_line1, shipping_line2, shipping_city, shipping_state,
            shipping_postal_code, shipping_country,
            stripe_payment_method_id,
            items: [{ hot_sauce_id, quantity }] }
        Your server prices the order from the database, charges the card, saves the order, and replies:
          200 { order: {...}, items: [...], payment: { status: "succeeded", payment_intent_id,
                amount_received_cents } }                        → paid
          402 { error: "Your card was declined.", code: "card_declined" } → nothing saved; show error
        Optional, if your server adds bank verification (3D Secure) support:
          200 { order: {...}, payment: { status: "requires_action", client_secret } }
     3. After bank verification, the page asks the server for the result: POST {} to
        ORDER_CONFIRM_URL if set, otherwise the same request to ORDER_URL again. Either way the
        server checks the PaymentIntent with Stripe (it must NOT charge again for an order_key
        that already has a PaymentIntent) and replies { status: "succeeded", id, total_cents }
        or { status: "failed", message }.
     Test mode (ORDER_URL is ""): stops after step 1. Nothing is saved or charged. */
  async function postJson(url, body) {
    clog("POST →", url);
    clog("Request body:", body);
    clog("Request body (JSON):", JSON.stringify(body, null, 2));
    const t0 = performance.now();
    let res;
    try {
      res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify(body)
      });
    } catch (netErr) {
      // fetch only throws for network/CORS problems, never for HTTP error codes
      cerr("Network or CORS error (no response reached the page):", netErr);
      throw new Error("We couldn't reach the server. Please check your connection and try again.");
    }
    const ms = Math.round(performance.now() - t0);
    const raw = await res.text();
    clog(`Response ← HTTP ${res.status} ${res.statusText} (${ms} ms)`);
    clog("Response headers:", Object.fromEntries(res.headers.entries()));
    clog("Response body (raw):", raw);
    let data = null;
    try { data = raw ? JSON.parse(raw) : null; } catch (e) { cerr("Response is not JSON:", e.message); }
    if (data) clog("Response body (parsed):", data);
    if (!res.ok || !data) {
      cerr(`Request failed: HTTP ${res.status}`, data || raw);
      const err = new Error((data && (data.error || data.message)) || "We couldn't place your order. Please try again.");
      err.code = data && data.code;
      throw err;
    }
    return data;
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setPayError("");
    clog("──────── Pay clicked ────────");
    clog("Mode:", CONFIG.ORDER_URL ? "live (ORDER_URL set)" : "test (ORDER_URL empty)", "| order_key:", orderKey.current);
    clog("Cart:", lines.map((l) => ({ name: l.p.name, slug: l.p.id, hot_sauce_id: l.p.dbId, qty: l.qty, price: l.p.price })),
      "| subtotal:", subtotal, "| shipping:", shipping, "| total:", total);
    const fieldsOk = validate();
    clog("Form valid:", fieldsOk, "| card complete:", cardState.complete, "| Stripe loaded:", !!stripe, "| card field mounted:", !!cardEl.current);
    if (!cardState.complete) setCardState((c) => ({ ...c, error: c.error || "Enter your card number, expiry date, and CVC." }));
    if (!fieldsOk || !cardState.complete || !stripe || !cardEl.current) { clog("Stopped: fix the form or card field first."); return; }

    // Every item needs its numeric hot_sauces id for the order
    const items = lines.map((l) => ({ hot_sauce_id: Number(l.p.dbId), quantity: l.qty }));
    clog("Items for the order:", items);
    if (CONFIG.ORDER_URL && items.some((i) => !Number.isInteger(i.hot_sauce_id))) {
      cerr("Stopped: an item has no numeric hot_sauce_id (the trio bundle?)", items);
      setPayError("The trio bundle can't be ordered online yet. Remove it from your order to continue.");
      return;
    }

    setProcessing(true);
    const address = {
      line1: form.address.trim(), line2: form.address2.trim() || undefined,
      city: form.city.trim(), state: form.state.trim().toUpperCase(), postal_code: form.zip.trim(), country: "US"
    };
    const billing_details = { name: form.name.trim(), email: form.email.trim(), address };
    const snapshot = { lines: lines.map((l) => ({ ...l })), subtotal, shipping, total, email: billing_details.email };

    try {
      // 1. Card → PaymentMethod
      clog("Step 1: creating Stripe PaymentMethod with billing details:", billing_details);
      const pmResult = await stripe.createPaymentMethod({ type: "card", card: cardEl.current, billing_details });
      if (pmResult.error) { cerr("Stripe createPaymentMethod error:", pmResult.error); throw new Error(pmResult.error.message); }
      const pmId = pmResult.paymentMethod.id;
      clog("Step 1 done: PaymentMethod", pmId, pmResult.paymentMethod);

      if (!CONFIG.ORDER_URL) {
        clog("Test mode: stopping after the PaymentMethod. Nothing saved or charged.");
        // Test mode: stop here
        setDone({ ...snapshot, reference: pmId, testMode: true });
        onPaid();
        return;
      }

      // 2. Save the order and charge the card on your server
      const orderBody = {
        order_key: orderKey.current,
        customer_name: billing_details.name,
        customer_email: billing_details.email,
        shipping_line1: address.line1,
        shipping_line2: address.line2 || null,
        shipping_city: address.city,
        shipping_state: address.state,
        shipping_postal_code: address.postal_code,
        shipping_country: address.country,
        stripe_payment_method_id: pmId,
        items
      };
      clog("Step 2: sending the order to the server");
      let reply = readOrderReply(await postJson(CONFIG.ORDER_URL, orderBody));
      clog("Step 2 done: payment status =", reply.status, "| order", reply.orderId, "| order status =", reply.orderStatus, reply);

      // 3. Bank verification, if the card needs it
      if (reply.status === "requires_action") {
        if (!reply.clientSecret) {
          cerr("Server said requires_action but sent no payment.client_secret:", reply);
          throw new Error("Your bank needs to verify this payment, but verification isn't set up yet. Please try another card.");
        }
        clog("Step 3: bank verification needed, opening Stripe's popup");
        const action = await stripe.handleNextAction({ clientSecret: reply.clientSecret });
        if (action.error) { cerr("Bank verification error:", action.error); throw new Error(action.error.message); }
        clog("Step 3: verification finished, PaymentIntent:", action.paymentIntent);
        clog("Step 3: asking the server for the final status");
        reply = readOrderReply(CONFIG.ORDER_CONFIRM_URL
          ? await postJson(CONFIG.ORDER_CONFIRM_URL.replace(":id", encodeURIComponent(reply.orderId)), {})
          : await postJson(CONFIG.ORDER_URL, orderBody)); // same order_key + pm: server reports the status
        clog("Step 3 done: payment status =", reply.status, reply);
      }

      if (reply.status === "processing") {
        throw new Error("Your payment is still processing. We'll email you once it's confirmed.");
      }
      if (reply.status !== "succeeded") {
        cerr("Payment not completed. Server reply:", reply);
        throw new Error(reply.message || "The payment didn't go through. Please try again.");
      }
      if (reply.orderStatus && reply.orderStatus !== "paid") {
        clog("Note: payment succeeded but order.status is", reply.orderStatus, "(the server should set it to 'paid').");
      }
      clog("Paid. Order", reply.orderId, "| PaymentIntent", reply.paymentIntentId, "| total_cents", reply.totalCents, "| received", reply.amountReceivedCents);

      // Show the server's numbers: they're what was actually charged
      const toDollars = (c, fallback) => (c != null ? c / 100 : fallback);
      const totals = {
        subtotal: toDollars(reply.subtotalCents, subtotal),
        shipping: toDollars(reply.shippingCents, shipping),
        tax: toDollars(reply.taxCents, 0),
        total: toDollars(reply.amountReceivedCents != null ? reply.amountReceivedCents : reply.totalCents, total)
      };
      setDone({
        ...snapshot, totals, total: totals.total,
        reference: reply.orderId != null ? `Order #${reply.orderId}` : reply.paymentIntentId,
        paymentIntentId: reply.paymentIntentId, orderId: reply.orderId,
        orderKey: reply.orderKey || orderKey.current, testMode: false
      });
      orderKey.current = newOrderKey(); // the next checkout gets a new key
      onPaid();
    } catch (err) {
      cerr("Checkout failed:", err.message, err);
      setPayError(err.message || "The payment didn't go through. Please try again.");
    } finally {
      clog("──────── Pay finished ────────");
      setProcessing(false);
    }
  }

  if (done) {
    return (
      <section className="eb-section" style={{ paddingTop: 56 }}>
        <div className="container">
          <div className="row g-5">
            <div className="col-lg-6">
              <p className="small fw-semibold mb-2" style={{ color: "var(--eb-chili)" }}>{done.testMode ? "Test order complete" : "Order confirmed"}</p>
              <h1 className="eb-display mb-3" style={{ fontSize: "clamp(40px, 5vw, 64px)" }}>Thanks, your sauce is on its way.</h1>
              {done.testMode
                ? <p className="fs-5 text-soft mb-2">In live mode, a receipt would go to {done.email}.</p>
                : <p className="fs-5 text-soft mb-2">Your receipt is on its way to {done.email}.</p>}
              {done.testMode
                ? <p className="small text-soft mb-4">Stripe payment method: {done.reference}</p>
                : <div className="mb-4">
                    <p className="small text-soft mb-1">{done.reference}{done.paymentIntentId && <>, payment {done.paymentIntentId}</>}</p>
                    <div className="bg-lime rounded-4 p-3 mt-3">
                      <div className="small fw-semibold mb-1">Your order reference</div>
                      <div className="d-flex flex-wrap align-items-center gap-2">
                        <code className="fs-6 text-break" style={{ color: "var(--eb-plum)" }}>{done.orderKey}</code>
                        <CopyButton text={done.orderKey} />
                      </div>
                      <div className="small mt-2">Save it to check your order later. <Link to={`/orders/${done.orderKey}`} className="fw-semibold text-reset">View this order</Link></div>
                    </div>
                  </div>}
              {done.testMode && (
                <p className="small mb-4">This was a test checkout, so no card was charged.</p>
              )}
              <div className="d-flex flex-wrap gap-3">
                <Link to="/" className="btn btn-plum btn-lg rounded-pill px-5 fw-semibold">Back to the home page</Link>
                <Link to="/sauces" className="btn btn-outline-plum btn-lg rounded-pill px-5 fw-semibold">Keep shopping</Link>
              </div>
            </div>
            <div className="col-lg-6"><OrderSummary lines={done.lines} subtotal={done.subtotal} totals={done.totals} readOnly /></div>
          </div>
        </div>
      </section>
    );
  }

  if (!lines.length) {
    return <NotFound title="Your cart is empty." text="Add a sauce or two, then come back here to check out." />;
  }

  return (
    <section className="eb-section" style={{ paddingTop: 48 }}>
      <div className="container">
        <nav aria-label="breadcrumb" className="mb-4">
          <ol className="breadcrumb small mb-0">
            <li className="breadcrumb-item"><Link to="/" className="text-reset">Home</Link></li>
            <li className="breadcrumb-item"><Link to="/sauces" className="text-reset">Sauces</Link></li>
            <li className="breadcrumb-item active text-soft" aria-current="page">Checkout</li>
          </ol>
        </nav>
        <h1 className="eb-h2 mb-5">Checkout</h1>

        <div className="row g-5 align-items-start">
          {/* Left: what's in the cart */}
          <div className="col-lg-5">
            <div style={{ position: "sticky", top: 96 }}>
              <OrderSummary lines={lines} subtotal={subtotal} setQty={setQty} />
            </div>
          </div>

          {/* Right: payment form */}
          <div className="col-lg-7">
            {!CONFIG.ORDER_URL && (
              <div className="rounded-4 p-3 mb-4 small border border-2" style={{ borderColor: "var(--eb-mustard)", background: "#FFF6DC" }}>
                <strong>Test mode.</strong> No card will be charged. Use card number 4242 4242 4242 4242 with any future date and any 3-digit CVC.
              </div>
            )}

            <form onSubmit={handleSubmit} noValidate>
              <h2 className="h5 fw-bold mb-3">Contact</h2>
              <div className="mb-4">
                <Field label="Email" id="eb-co-email" type="email" autoComplete="email" placeholder="you@email.com"
                  value={form.email} onChange={set("email")} error={errors.email} />
              </div>

              <h2 className="h5 fw-bold mb-3">Shipping address</h2>
              <div className="row g-3 mb-4">
                <div className="col-12"><Field label="Full name" id="eb-co-name" autoComplete="name" value={form.name} onChange={set("name")} error={errors.name} /></div>
                <div className="col-12"><Field label="Street address" id="eb-co-address" autoComplete="address-line1" value={form.address} onChange={set("address")} error={errors.address} /></div>
                <div className="col-12"><Field label="Apartment, suite, etc. (optional)" id="eb-co-address2" autoComplete="address-line2" value={form.address2} onChange={set("address2")} /></div>
                <div className="col-md-5"><Field label="City" id="eb-co-city" autoComplete="address-level2" value={form.city} onChange={set("city")} error={errors.city} /></div>
                <div className="col-6 col-md-3"><Field label="State" id="eb-co-state" autoComplete="address-level1" placeholder="TX" value={form.state} onChange={set("state")} error={errors.state} /></div>
                <div className="col-6 col-md-4"><Field label="ZIP code" id="eb-co-zip" autoComplete="postal-code" inputMode="numeric" value={form.zip} onChange={set("zip")} error={errors.zip} /></div>
              </div>

              <h2 className="h5 fw-bold mb-3">Payment</h2>
              <div className="mb-2">
                <label className="form-label small fw-semibold mb-1">Card</label>
                <div ref={cardRef} className={`form-control form-control-lg bg-paper ${cardState.error ? "is-invalid" : ""}`}
                  style={{ borderRadius: 14, paddingTop: 14, paddingBottom: 14, minHeight: 54 }} />
                {cardState.error && <div className="invalid-feedback d-block">{cardState.error}</div>}
                {stripeError && <div className="small mt-2" style={{ color: "var(--eb-chili)" }}>{stripeError}</div>}
              </div>
              <p className="small text-soft mb-4">Payments are processed securely by Stripe. Card details never touch this site.</p>

              {payError && <div className="alert alert-danger rounded-4 small" role="alert">{payError}</div>}

              <button type="submit" className="btn btn-plum btn-lg rounded-pill w-100 fw-semibold py-3" disabled={processing || !stripe}>
                {processing
                  ? <><span className="spinner-border spinner-border-sm me-2" aria-hidden="true" />Processing payment</>
                  : `Pay ${money(total)}`}
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ---------- order lookup ---------- */
function CopyButton({ text }) {
  const [copied, setCopied] = useState(false);
  function copy() {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => {});
    else {
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {} document.body.removeChild(ta);
    }
  }
  return <button type="button" className="btn btn-sm btn-outline-plum rounded-pill px-3" onClick={copy}>{copied ? "Copied" : "Copy"}</button>;
}

const centsToMoney = (c) => money((Number(c) || 0) / 100);
const fmtDate = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
};

// The server may leave status "pending" after a successful payment, so payment_status decides "Paid"
function orderBadge(order) {
  const st = (order.status || "").toLowerCase();
  const pay = (order.payment_status || "").toLowerCase();
  if (st === "refunded" || pay === "refunded") return { label: "Refunded", bg: "#F1E6F0" };
  if (st === "canceled") return { label: "Canceled", bg: "#EDE8E3" };
  if (st === "paid" || pay === "succeeded") return { label: "Paid", bg: "var(--eb-lime)" };
  if (pay === "failed" || st === "failed") return { label: "Payment failed", bg: "#FBE3D2" };
  return { label: "Awaiting payment", bg: "#FFF6DC" };
}

// GET the order. Result: { status: "idle" | "loading" | "found" | "notfound" | "unpaid" | "error", data }
function useOrderLookup(orderKey) {
  const [state, setState] = useState({ status: "idle", data: null });
  const [attempt, setAttempt] = useState(0);
  useEffect(() => {
    if (!orderKey) { setState({ status: "idle", data: null }); return; }
    if (!UUID_RE.test(orderKey)) { setState({ status: "notfound", data: null }); return; }
    let cancelled = false;
    setState({ status: "loading", data: null });
    const url = CONFIG.ORDER_LOOKUP_URL.replace(":order_key", encodeURIComponent(orderKey));
    clog("Order lookup GET →", url);
    fetch(url, { headers: { Accept: "application/json" } })
      .then(async (res) => {
        const raw = await res.text();
        clog(`Order lookup ← HTTP ${res.status}`, raw);
        let data = null;
        try { data = raw ? JSON.parse(raw) : null; } catch (e) { /* not JSON */ }
        if (cancelled) return;
        if (data && data.order) setState({ status: "found", data });
        else if (data && (data.payment_status || /payment not completed/i.test(data.error || ""))) setState({ status: "unpaid", data });
        else if (res.status === 404 || (data && /not found/i.test(data.error || ""))) setState({ status: "notfound", data });
        else throw new Error("HTTP " + res.status);
      })
      .catch((err) => { if (!cancelled) { cerr("Order lookup failed:", err); setState({ status: "error", data: null }); } });
    return () => { cancelled = true; };
  }, [orderKey, attempt]);
  return { ...state, retry: () => setAttempt((a) => a + 1) };
}

/* ---------- GHL wrapper fixes ----------
   1) Sticky header breaks if a parent hides overflow, so reset it.
   2) Remove side padding/margins/max-width GHL adds around this block (stops at the GHL section). */
function useGhlWrapperFix(ref) {
  useEffect(() => {
    let el = ref.current && ref.current.parentElement;
    let steps = 0;
    while (el && el !== document.body && el !== document.documentElement) {
      const cs = getComputedStyle(el);
      if (/(hidden|auto|scroll|clip)/.test(cs.overflow + cs.overflowX + cs.overflowY)) el.style.overflow = "visible";
      if (steps < 8) {
        ["padding-left", "padding-right", "margin-left", "margin-right"].forEach((prop) => el.style.setProperty(prop, "0", "important"));
        el.style.setProperty("max-width", "100%", "important");
        el.style.setProperty("width", "100%", "important");
        if (/^section-/.test(el.id || "") || /(^|\s)(c-section|fullSection)(\s|$)/.test(el.className || "")) steps = 99;
      }
      el = el.parentElement; steps++;
    }
  }, [ref]);
}

  const rootRef = useRef(null);
  useGhlWrapperFix(rootRef);

  const { top, full, topItems, known, reloadTop, reloadAll, ensureAll } = useSauceData();
  const sauces = known; // every sauce loaded so far, for the cart
  const [cart, setCart] = useState(loadCart);
  // Snapshots of sauces in the cart, so items added from the full list still show
  // after a reload, when only the top sauces are loaded.
  const [cartItems, setCartItems] = useState(loadCartItems);
  const [cartOpen, setCartOpen] = useState(false);
  const [toast, setToast] = useState("");
  const toastTimer = useRef(null);

  const byId = useCallback((id) => {
    if (id === CONFIG.BUNDLE.id) return CONFIG.BUNDLE;
    return sauces.find((s) => s.id === id) || cartItems[id] || null;
  }, [sauces, cartItems]);

  // Save cart
  useEffect(() => {
    try {
      localStorage.setItem(CONFIG.CART_KEY, JSON.stringify(cart));
      const snap = {};
      Object.keys(cart).forEach((id) => { if (cartItems[id]) snap[id] = cartItems[id]; });
      localStorage.setItem(CONFIG.CART_ITEMS_KEY, JSON.stringify(snap));
    } catch (e) {}
  }, [cart, cartItems]);

  // Keep cart snapshots up to date with the latest prices and stock
  useEffect(() => {
    if (!sauces.length) return;
    setCartItems((ci) => {
      const next = { ...ci };
      sauces.forEach((s) => { if (next[s.id]) next[s.id] = s; });
      return next;
    });
  }, [sauces]);

  // Drop cart items that are no longer sold. Only the full list can tell us that,
  // and items with no saved details (from an older cart) are dropped too.
  useEffect(() => {
    setCart((c) => {
      const next = {};
      Object.keys(c).forEach((id) => {
        const inFull = full.status === "ready" ? full.all.some((s) => s.id === id) : true;
        if (id === CONFIG.BUNDLE.id || (inFull && (cartItems[id] || sauces.some((s) => s.id === id)))) next[id] = c[id];
      });
      return Object.keys(next).length === Object.keys(c).length ? c : next;
    });
  }, [sauces, full.status]);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 2200);
  };

  const add = (id, qty = 1, product) => {
    const p = product || byId(id);
    if (p && id !== CONFIG.BUNDLE.id) setCartItems((ci) => ({ ...ci, [id]: p }));
    setCart((c) => ({ ...c, [id]: (c[id] || 0) + qty }));
    showToast(qty > 1 ? `${qty} × ${p ? p.name : "item"} added to cart` : `${p ? p.name : "Item"} added to cart`);
  };
  const buyNow = (id, qty, product) => { add(id, qty, product); setCartOpen(true); };
  const setQty = (id, qty) => setCart((c) => {
    const next = { ...c };
    if (qty <= 0) delete next[id]; else next[id] = qty;
    return next;
  });
  const closeCart = useCallback(() => setCartOpen(false), []);

  const lines = Object.keys(cart).map((id) => ({ p: byId(id), qty: cart[id] })).filter((l) => l.p);
  const count = lines.reduce((n, l) => n + l.qty, 0);
  const subtotal = lines.reduce((n, l) => n + l.p.price * l.qty, 0);

  return (
    <div id="eb-store" ref={rootRef}>
      <div className="bg-plum text-mustard text-center small py-2 px-3">Free shipping on orders over {money(CONFIG.FREE_SHIP_AT)}</div>
      <ScrollManager />
      <Header count={count} onOpenCart={() => setCartOpen(true)} />
      <Routes>
        <Route path="/" element={
          <>
            <Hero sauces={topItems} status={top.status} onAdd={add} />
            <Shop status={top.status} bestSelling={top.bestSelling} hottest={top.hottest} reload={reloadTop} onAdd={add} />
            <Process />
            <Reviews />
            <Bundle onAddBundle={() => { add(CONFIG.BUNDLE.id); setCartOpen(true); }} />
            <Faq />
            <Newsletter />
          </>
        } />
        <Route path="/sauces" element={
          <SaucesPage status={full.status} all={full.all} reload={reloadAll} ensureAll={ensureAll} onAdd={add} />
        } />
        <Route path="/sauce/:id" element={
          <ItemPage cart={cart} onAdd={add} onBuyNow={buyNow}
            related={uniqueSauces([top.bestSelling, top.hottest])} relatedStatus={top.status} />
        } />
        <Route path="/checkout" element={<CheckoutPage lines={lines} subtotal={subtotal} setQty={setQty} onPaid={() => setCart({})} />} />
        <Route path="/orders" element={<OrdersPage known={known} />} />
        <Route path="/orders/:orderKey" element={<OrdersPage known={known} />} />
        <Route path="*" element={<NotFound title="This page doesn't exist." text="The link may be old or mistyped." />} />
      </Routes>
      <Footer />
      <CartDrawer open={cartOpen} onClose={closeCart} lines={lines} subtotal={subtotal} count={count} setQty={setQty} />
      <Toast message={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("eb-root")).render(
  <HashRouter>
    <App />
  </HashRouter>
);
</script>
